gth="1" stroke="#39424e" stroke-linecap="round" stroke-width="2.8000000000000003"></path></svg></span></div><p class="mb-6 inline-grid gap-1 rounded-xl border-2 border-brand bg-white px-5 py-3 font-bold text-brand sm:flex sm:items-center sm:gap-3"><span class="text-[.85rem] text-brand-2">研修名</span><span class="jp text-[1.1rem]">主体的<wbr/>行動および業務理解力向上研修</span></p><div class="grid gap-4"><span class="flex items-center gap-2 text-[.95rem] font-bold text-brand"><span class="h-px w-6 bg-brand"></span>職種別</span><ul class="grid gap-4 md:grid-cols-2"><li class="grid content-start gap-3 rounded-2xl border border-line bg-white p-6 md:p-7" style="border-top:4px solid #1d2f5e"><div class="flex items-baseline gap-3"><span class="font-display text-[1.8rem] leading-none text-brand-2">01</span><div class="grid"><span class="font-mono text-[.68rem] tracking-[.2em] text-muted uppercase">Employment support</span><h3 class="text-[1.2rem] font-bold text-brand">就労支援事業所向け</h3></div></div><p class="jp text-[.93rem] leading-[1.9]">就労支援事業所の<wbr/>職員が、<wbr/>利用者アセスメント・傾聴面談・支援方針の<wbr/>合意形成・モチベーション支援・支援記録・業務標準化・個別支援計画の<wbr/>評価・実行管理を<wbr/>学ぶ<wbr/>全8回の<wbr/>研修です。<wbr/>架空の<wbr/>支援ケースを<wbr/>用いた<wbr/>講義・演習を<wbr/>通じ、<wbr/>利用者の<wbr/>意向を<wbr/>尊重しながら<wbr/>職員間・関係<wbr/>機関との<wbr/>連携に<wbr/>必要な<wbr/>技能を<wbr/>段階的に<wbr/>習得します。</p></li><li class="grid content-start gap-3 rounded-2xl border border-line bg-white p-6 md:p-7" style="border-top:4px solid #1d2f5e"><div class="flex items-baseline gap-3"><span class="font-display text-[1.8rem] leading-none text-brand-2">02</span><div class="grid"><span class="font-mono text-[.68rem] tracking-[.2em] text-muted uppercase">Sales</span><h3 class="text-[1.2rem] font-bold text-brand">営業職向け</h3></div></div><p class="jp text-[.93rem] leading-[1.9]">営業職の<wbr/>社員が、<wbr/>顧客ニーズの<wbr/>把握・提案方針の<wbr/>調整・信頼関係構築・営業業務分析・顧客情報共有・営業実績分析・目標設定・実行管理の<wbr/>知識と<wbr/>技能を<wbr/>段階的に<wbr/>習得する<wbr/>全8回の<wbr/>研修です。<wbr/>架空の<wbr/>商談・営業案件を<wbr/>用いた<wbr/>講義・演習に<wbr/>より、<wbr/>顧客の<wbr/>課題に<wbr/>応じた<wbr/>対応力と<wbr/>営業<wbr/>活動の<wbr/>改善力を<wbr/>養います。</p></li><li class="grid content-start gap-3 rounded-2xl border border-line bg-white p-6 md:p-7" style="border-top:4px solid #1d2f5e"><div class="flex items-baseline gap-3"><span class="font-display text-[1.8rem] leading-none text-brand-2">03</span><div class="grid"><span class="font-mono text-[.68rem] tracking-[.2em] text-muted uppercase">Human resources</span><h3 class="text-[1.2rem] font-bold text-brand">人事担当者向け</h3></div></div><p class="jp text-[.93rem] leading-[1.9]">人事担当者が、<wbr/>従業員の<wbr/>課題把握・傾聴面談・人材育成方針の<wbr/>調整・モチベーション支援・人事業務分析・従業員情報の<wbr/>共有・人材育成施策の<wbr/>評価・実行管理の<wbr/>知識と<wbr/>技能を<wbr/>段階的に<wbr/>習得する<wbr/>全8回の<wbr/>研修です。<wbr/>架空の<wbr/>従業員面談・人事課題を<wbr/>用いた<wbr/>講義・演習を<wbr/>通じ、<wbr/>従業員の<wbr/>特性や<wbr/>課題に<wbr/>応じた<wbr/>対応力と<wbr/>人材育成・組織運営に<wbr/>必要な<wbr/>実務能力を<wbr/>養います。</p></li><li class="grid content-start gap-3 rounded-2xl border border-line bg-white p-6 md:p-7" style="border-top:4px solid #1d2f5e"><div class="flex items-baseline gap-3"><span class="font-display text-[1.8rem] leading-none text-brand-2">04</span><div class="grid"><span class="font-mono text-[.68rem] tracking-[.2em] text-muted uppercase">Managers</span><h3 class="text-[1.2rem] font-bold text-brand">管理職向け</h3></div></div><p class="jp text-[.93rem] leading-[1.9]">管理職が、<wbr/>部下の<wbr/>課題把握・傾聴面談・業務方針の<wbr/>共有と<wbr/>合意形成・モチベーション支援・業務分析・チーム内の<wbr/>情報共有と<wbr/>業務標準化・目標設定と<wbr/>成果評価・実行管理の<wbr/>知識と<wbr/>技能を<wbr/>段階的に<wbr/>習得する<wbr/>全8回の<wbr/>研修です。<wbr/>架空の<wbr/>職場課題・部下指導の<wbr/>ケースを<wbr/>用いた<wbr/>講義・演習を<wbr/>通じ、<wbr/>部下の<wbr/>主体的な<wbr/>行動を<wbr/>促す指導力と<wbr/>チームの<wbr/>業務遂行能力を<wbr/>高める<wbr/>マネジメント力を<wbr/>養います。</p></li></ul></div><div class="mt-6"><dl class="overflow-hidden rounded-2xl border border-line bg-white"><div class="grid gap-1 border-b border-line px-5 py-4 last:border-b-0 sm:grid-cols-[200px_1fr] sm:gap-4"><dt class="font-bold text-brand">訓練時間数</dt><dd class="jp">合計20時間<wbr/>（8回 各2.5時間）</dd></div><div class="grid gap-1 border-b border-line px-5 py-4 last:bor dle" x="75" y="58">72</text><text fill="#5a6f6a" font-size="15" text-anchor="middle" x="75" y="224">導入前</text></g><g><rect fill="#9fd8c9" height="156" rx="8" width="70" x="150" y="44"></rect><text fill="#1f2d2a" font-size="22" font-weight="800" text-anchor="middle" x="185" y="34">76</text><text fill="#5a6f6a" font-size="15" text-anchor="middle" x="185" y="224">6か月後</text></g><g><rect fill="#0F6E56" height="174" rx="8" width="70" x="260" y="26"></rect><text fill="#1f2d2a" font-size="22" font-weight="800" text-anchor="middle" x="295" y="16">79</text><text fill="#5a6f6a" font-size="15" text-anchor="middle" x="295" y="224">12か月後</text></g></svg></div><div class="th-card th-tip"><h4>次の施策へ</h4><p>承認と<wbr/>心理的安全性が<wbr/>改善。<wbr/>次は<wbr/>「主体性」を<wbr/>伸ばすため、<wbr/>仕事の<wbr/>棚卸しと<wbr/>目標設定に<wbr/>重点を<wbr/>置きます。</p></div></div></div></div></div></div></div><div class="base"></div></div></div></div></section><section class="bg-brand-tint border-t border-line py-16 md:py-24"><div class="mx-auto w-full max-w-[1140px] px-5"><div class="mb-10 grid items-end gap-6"><div class="grid max-w-3xl gap-3"><span class="en-label">FAQ</span><h2 class="jp font-display text-[clamp(1.5rem,3.4vw,2.4rem)] leading-snug">よく<wbr/>ある<wbr/>質問</h2></div></div><div class="grid max-w-4xl gap-3"><details class="group rounded-xl border border-line bg-white px-5"><summary class="grid cursor-pointer list-none grid-cols-[1.8em_1fr_1.2em] items-baseline gap-2 py-4 font-bold [&amp;::-webkit-details-marker]:hidden"><span class="font-serif text-lg text-brand-2">Q</span><span><span class="jp">社員数が<wbr/>少なくても<wbr/>依頼できますか？</span></span><span aria-hidden="true" class="text-muted group-open:rotate-45 transition-transform">＋</span></summary><p class="pb-5 pl-[2.3em] text-[.95rem] text-muted"><span class="jp">社員20名以上の<wbr/>企業を<wbr/>主な<wbr/>対象と<wbr/>していますが、<wbr/>それより<wbr/>少ない<wbr/>場合も<wbr/>ご相談ください。<wbr/>研修は<wbr/>1グループ6〜9名程度で<wbr/>進める<wbr/>ことを<wbr/>想定しています。</span></p></details><details class="group rounded-xl border border-line bg-white px-5"><summary class="grid cursor-pointer list-none grid-cols-[1.8em_1fr_1.2em] items-baseline gap-2 py-4 font-bold [&amp;::-webkit-details-marker]:hidden"><span class="font-serif text-lg text-brand-2">Q</span><span><span class="jp">研修の<wbr/>期間と<wbr/>1回の<wbr/>時間は<wbr/>どの<wbr/>くらいですか？</span></span><span aria-hidden="true" class="text-muted group-open:rotate-45 transition-transform">＋</span></summary><p class="pb-5 pl-[2.3em] text-[.95rem] text-muted"><span class="jp">全8回の<wbr/>実践型研修で、<wbr/>各回2.5時間です。<wbr/>各回の<wbr/>あとに<wbr/>職場での<wbr/>実践期間を<wbr/>設け、<wbr/>振り返りを<wbr/>行ってから<wbr/>次の<wbr/>回へ<wbr/>進みます。</span></p></details><details class="group rounded-xl border border-line bg-white px-5"><summary class="grid cursor-pointer list-none grid-cols-[1.8em_1fr_1.2em] items-baseline gap-2 py-4 font-bold [&amp;::-webkit-details-marker]:hidden"><span class="font-serif text-lg text-brand-2">Q</span><span><span class="jp">研修だけを<wbr/>依頼する<wbr/>ことは<wbr/>できますか？</span></span><span aria-hidden="true" class="text-muted group-open:rotate-45 transition-transform">＋</span></summary><p class="pb-5 pl-[2.3em] text-[.95rem] text-muted"><span class="jp">まず<wbr/>トリプルヘルスで<wbr/>組織の<wbr/>状態を<wbr/>把握し、<wbr/>その<wbr/>結果を<wbr/>もとに<wbr/>研修の<wbr/>重点を<wbr/>決める<wbr/>ことを<wbr/>おすすめしています。<wbr/>ご状況に<wbr/>合わせて<wbr/>ご相談ください。</span></p></details><details class="group rounded-xl border border-line bg-white px-5"><summary class="grid cursor-pointer list-none grid-cols-[1.8em_1fr_1.2em] items-baseline gap-2 py-4 font-bold [&amp;::-webkit-details-marker]:hidden"><span class="font-serif text-lg text-brand-2">Q</span><span><span class="jp">管理職だけを<wbr/>対象に<wbr/>できますか？</span></span><span aria-hidden="true" class="text-muted group-open:rotate-45 transition-transform">＋</span></summary><p class="pb-5 pl-[2.3em] text-[.95rem] text-muted"><span class="jp">管理職への<wbr/>フィードバックや<wbr/>1on1支援など、<wbr/>管理職向けの<wbr/>支援も<wbr/>ご用意しています。<wbr/>対象者は<wbr/>会社の<wbr/>課題に<wbr/>合わせて<wbr/>決めます。</span></p></details><details class="group rou     document.querySelectorAll('header nav a[data-go]').forEach(function (a) {
      var t = parse(a.dataset.go), on = t.site === D.site && (t.id === id || id.indexOf(t.id + "-") === 0);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");

    });
  }
  function show(id, service, keepScroll) {
    var t = document.getElementById("tpl-" + id); if (!t) return false;
    main.innerHTML = ""; main.appendChild(t.content.cloneNode(true));
    fixIlls(main); fixLinks(main); setupSurveys(main); setupForms(main, service); navActive(id);
    requestAnimationFrame(function () { scale(document); if (window.LauleaMotion) window.LauleaMotion.init(main); });
    if (D.titles[id]) document.title = D.titles[id];
    if (!keepScroll) window.scrollTo(0, 0);
    return true;
  }
  function go(a, e) {
    var t = parse(a.dataset.go); if (e) { e.preventDefault(); e.stopPropagation(); }
    if (show(t.id, t.service)) { try { history.replaceState(null, "", "#" + t.id); } catch (_) {} }
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[data-go]"); if (a) go(a, e);
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;

  }, true);
  window.addEventListener("hashchange", function () { var id = location.hash.slice(1); if (id) show(id); });
  window.addEventListener("resize", function () { scale(document); });
  fixIlls(document); fixLinks(document);
  var start = location.hash.slice(1);
  if (!(start && show(start, null, true))) show("top", null, true);
})();
